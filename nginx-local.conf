worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  patelwarehouse.in;

        # Route requests starting with /api to the Spring Boot backend
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            
            # Forward necessary headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS Headers (Optional if Spring Boot handles it, but good to have)
            add_header 'Access-Control-Allow-Origin' 'http://patelwarehouse.in';
            add_header 'Access-Control-Allow-Credentials' 'true';
        }

        # Route all other requests to the React Frontend (Vite Dev Server)
        location / {
            proxy_pass http://127.0.0.1:5173/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Required for Vite WebSockets (Hot Module Reloading)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
